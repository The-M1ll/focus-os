[package]
name = "focus-core"
version = "0.1.1"
edition = "2024"

[features]
test-support = []

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
if-addrs = "0.15.0"
mdns-sd = "0.21.6"
rand = "0.8"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
sysinfo = { version = "0.40.0", default-features = false, features = ["system"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
url = "2.5.8"
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"
focus-core = { path = ".", features = ["test-support"] }
