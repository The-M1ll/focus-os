[package]
name = "focus-os"
version = "0.1.1"
description = "FOCUS OS - local-first study environment"
edition = "2024"
rust-version = "1.85"

[features]
# Embeds the built frontend instead of loading the dev server. `tauri build` enables this.
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "focus_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
focus-core = { path = "../crates/focus-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"
focus-core = { path = "../crates/focus-core", features = ["test-support"] }
