# Publishes installers to the repository's Releases page when a version tag (v*) is pushed.
# Installers are UNSIGNED (no Apple/Microsoft certificates): macOS and Windows will warn on first launch.
name: release
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['.github/workflows/release.yml']   # editing this file publishes a release (v0.1.0 unless a tag is pushed)
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to create, e.g. v0.1.1'
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: "${{ inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.1.0' }}"
          releaseName: "FOCUS OS ${{ inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.1.0' }}"
          releaseBody: |
            Unsigned preview build. Windows SmartScreen / macOS Gatekeeper will warn on first launch.
            macOS: right-click the app, choose Open (or run `xattr -cr "/Applications/FOCUS OS.app"`).
            Browser extension (Chrome/Edge/Brave/Arc, load unpacked): `focus-os-chrome-extension.zip`.
            See PROJECT_STATUS.md and KNOWN_LIMITATIONS.md for what is and is not verified.
          releaseDraft: false
          prerelease: true

  extension:
    runs-on: ubuntu-latest
    needs: installers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:extension
      - run: cd extension/dist && zip -r ../../focus-os-chrome-extension.zip .
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.1.0' }}" focus-os-chrome-extension.zip --clobber
