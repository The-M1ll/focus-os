<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FOCUS OS extension</title>
    <style>
      :root { color-scheme: dark; --bg:#0e0e0f; --text:#f2ede0; --mute:#bdb7a8; --line:#3a3a3d; --acc:#cfef5b; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
      main { max-width: 560px; margin: 48px auto; padding: 0 24px; }
      h1 { font: 300 2rem Georgia, serif; margin: 0 0 8px; }
      p { color: var(--mute); }
      label { display: block; margin: 20px 0 6px; font-size: 13px; color: var(--mute); }
      input { width: 100%; box-sizing: border-box; padding: 10px 12px; background: #0a0a0b; color: var(--text); border: 1px solid var(--line); border-radius: 10px; font: inherit; }
      input:focus-visible, button:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
      button { margin: 20px 8px 0 0; padding: 10px 18px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--text); font: 600 13px system-ui; cursor: pointer; }
      button.primary { background: var(--acc); color: #12140a; border-color: var(--acc); }
      #status[data-ok='true'] { color: var(--acc); } #status[data-ok='false'] { color: #f2b84b; }
      #error { color: #ff8a7a; min-height: 1.5em; }
      hr { border: 0; border-top: 1px solid var(--line); margin: 32px 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>FOCUS OS extension</h1>
      <p>Measures the time you spend on limited websites and blocks them when a limit is reached. It talks only to the FOCUS OS app on this computer. Open <b>Limits</b> in the app to copy the two values below.</p>
      <label for="base">App address</label>
      <input id="base" value="http://127.0.0.1:47777" autocomplete="off" />
      <label for="token">Token</label>
      <input id="token" type="password" autocomplete="off" placeholder="Paste the token (it is not shown again)" />
      <p id="error" role="alert"></p>
      <button class="primary" id="save">Connect</button><button id="refresh">Check now</button>
      <hr />
      <p id="status" role="status" aria-live="polite"></p>
      <p id="usage"></p>
    </main>
    <script type="module" src="./options.ts"></script>
  </body>
</html>
